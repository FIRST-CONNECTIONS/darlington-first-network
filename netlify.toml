# Netlify config for Darlington First
# Place this file at the root of your site repo (alongside index.html)

[build]
  functions = "netlify/functions"
  publish = "."

# Clean function URLs — so /.netlify/functions/subscribe becomes /api/subscribe
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: page paths (/about, /funding…) serve index.html and the
# router shows the right page. Not forced, so real files (robots.txt,
# sitemap.xml, images) are still served directly.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Optional: explicit function settings
[functions]
  node_bundler = "esbuild"

# ─── Headers: security + caching ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# HTML must always revalidate so deploys show up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-cache static assets (applies once images are served from this
# domain — SEO plan, Phase 3)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
